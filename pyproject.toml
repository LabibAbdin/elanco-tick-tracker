[project]
name = "tick-tracker-uk"
version = "1.0.0"
description = "Backend MVP for a UK tick sightings tracker: resilient ingestion, search, analytics and statistical insights."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "ijson>=3.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "respx==0.23.1",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",  # third-party notice, not our code
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in defaults is idiomatic
    "E501",  # the formatter owns line length; long user-facing strings are left intact
]
